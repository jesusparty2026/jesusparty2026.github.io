<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I Will Be at Jesus Party 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff9ec;--ink:#2a1b04;--muted:#6e5a38;--gold:#e8961a;--on-gold:#1a1103;--line:#e3cf9f;--card:#fff;color-scheme:light dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0a04;--ink:#fff1d6;--muted:#c9ab72;--gold:#f5a32a;--on-gold:#1a1103;--line:#3a2a10;--card:#1a1208}}
:root[data-theme="dark"]{--bg:#0f0a04;--ink:#fff1d6;--muted:#c9ab72;--gold:#f5a32a;--on-gold:#1a1103;--line:#3a2a10;--card:#1a1208}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:24px 18px 40px}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 8px;font-weight:700}
.lead{margin:0 0 20px;color:var(--muted);font-size:.95rem}
.stage{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(232,150,26,.28);border:1px solid var(--line);background:#000}
canvas{display:block;width:100%;height:auto;touch-action:auto;cursor:pointer}
canvas.has-photo{touch-action:none;cursor:grab}
.panel{margin-top:18px;display:grid;gap:12px}
button{font:inherit;font-weight:600;min-height:50px;border-radius:12px;border:2px solid var(--gold);padding:0 18px;cursor:pointer;background:transparent;color:var(--ink)}
button.primary{background:var(--gold);color:var(--on-gold)}
button.link{border-color:transparent;color:var(--muted);text-decoration:underline;min-height:44px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.zoom{display:grid;gap:6px;font-size:.9rem;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--gold);height:32px}
.edit[hidden],#out[hidden],#shareBtn[hidden]{display:none}
.edit{display:grid;gap:12px}
#msg{min-height:1.4em;margin:0;font-size:.9rem;color:var(--ink)}
#msg.err{color:#c0392b;font-weight:600}
#out{width:100%;border-radius:14px;border:1px solid var(--line)}
.note{font-size:.8rem;color:var(--muted);text-align:center;margin:22px 0 0}
</style>
</head>
<body>
<main>
  <h1>I will be at Jesus Party 2026</h1>
  <p class="lead">Add your photo to get your own frame, then save it and post it so your friends know you’re coming.</p>

  <div class="stage"><canvas id="cv" role="img" aria-label="Jesus Party 2026 flyer with a round frame for your photo"></canvas></div>

  <div class="panel">
    <input id="file" type="file" accept="image/*" hidden>
    <button id="pick" class="primary" type="button">Choose your photo</button>
    <div id="edit" class="edit" hidden>
      <label class="zoom">Zoom
        <input id="zoom" type="range" min="1" max="3" step="0.01" value="1">
      </label>
      <p class="lead" style="margin:0">Drag the photo to move it.</p>
      <button id="saveBtn" class="primary" type="button">Save image</button>
      <button id="shareBtn" type="button" hidden>Share</button>
      <button id="change" class="link" type="button">Choose a different photo</button>
    </div>
    <p id="msg" role="status" aria-live="polite"></p>
    <img id="out" alt="Your finished frame" hidden>
  </div>
  <p class="note">Your photo stays on your phone. Nothing is uploaded.</p>
</main>

const W=1200,H=1794,CX=610,CY=1303,R=275;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
const frame=new Image();
let photo=null,zoom=1,ox=0,oy=0,ready=false,drag=null;

function msg(t,err){const m=$('msg');m.textContent=t||'';m.className=err?'err':''}
function base(){return Math.max(2*R/photo.width,2*R/photo.height)}
function clamp(){
  const s=base()*zoom,mx=Math.max(0,(photo.width*s-2*R)/2),my=Math.max(0,(photo.height*s-2*R)/2);
  ox=Math.min(mx,Math.max(-mx,ox));oy=Math.min(my,Math.max(-my,oy));
}
function draw(){
  if(!ready)return;
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(frame,0,0,W,H);
  ctx.save();ctx.beginPath();ctx.arc(CX,CY,R+3,0,Math.PI*2);ctx.clip();
  if(photo){
    clamp();
    const s=base()*zoom,w=photo.width*s,h=photo.height*s;
    ctx.drawImage(photo,CX+ox-w/2,CY+oy-h/2,w,h);
  }
  ctx.restore();
  ctx.beginPath();ctx.arc(CX,CY,R+3,0,Math.PI*2);
  ctx.lineWidth=6;ctx.strokeStyle='#e9a93a';ctx.stroke();
  if(!photo){
    ctx.fillStyle='#f5a32a';ctx.textAlign='center';
    ctx.font='700 120px Poppins,system-ui,sans-serif';ctx.fillText('+',CX,CY+10);
    ctx.font='600 40px Poppins,system-ui,sans-serif';ctx.fillText('Tap to add your photo',CX,CY+90);
  }
}
frame.onload=()=>{ready=true;draw()};
frame.src=FRAME;

async function load(f){
  if(!f)return;
  if(!f.type.startsWith('image/')){msg('That file isn’t an image. Choose a JPG or PNG photo.',true);return}
  try{
    try{photo=await createImageBitmap(f,{imageOrientation:'from-image'})}
    catch(_){
      photo=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
    }
  }catch(e){msg('We couldn’t open that photo. Try a different one.',true);return}
  zoom=1;ox=0;oy=0;$('zoom').value=1;
  cv.classList.add('has-photo');
  $('pick').hidden=true;$('edit').hidden=false;$('out').hidden=true;
  msg('');draw();
}

$('pick').onclick=()=>$('file').click();
$('change').onclick=()=>$('file').click();
cv.addEventListener('click',()=>{if(!photo)$('file').click()});
$('file').onchange=e=>{load(e.target.files[0]);e.target.value=''};
$('zoom').oninput=e=>{zoom=+e.target.value;draw()};

cv.addEventListener('pointerdown',e=>{if(!photo)return;cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,ox,oy}});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  const k=W/cv.getBoundingClientRect().width;
  ox=drag.ox+(e.clientX-drag.x)*k;oy=drag.oy+(e.clientY-drag.y)*k;draw();
});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{drag=null}));
cv.addEventListener('wheel',e=>{
  if(!photo)return;e.preventDefault();
  zoom=Math.min(3,Math.max(1,zoom*(e.deltaY<0?1.05:0.95)));$('zoom').value=zoom;draw();
},{passive:false});

const NAME='i-will-be-at-jesus-party-2026.jpg';
const toBlob=()=>new Promise(r=>cv.toBlob(r,'image/jpeg',0.93));

function showFallback(b){
  const o=$('out');o.src=URL.createObjectURL(b);o.hidden=false;
  msg('Press and hold the image below, then choose Save to photos.');
  o.scrollIntoView({behavior:'smooth',block:'center'});
}
$('saveBtn').onclick=async()=>{
  const b=await toBlob();
  let d=null;
  try{d=window.claude?await window.claude.use('downloads'):null}catch(_){}
  if(!d){showFallback(b);return}
  try{await d.save({filename:NAME,data:b});msg('Saved. Post it and tell your friends.')}
  catch(e){if(e&&e.code==='declined')return;showFallback(b)}
};
